<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DINER DASH!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --text: #2D3436;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Fredoka', sans-serif; overflow: hidden; }

        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; align-items: center; 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
        }

        /* NEW POSITION: Middle Bottom */
        #home-screen { 
            display: flex; 
            background-color: #a29bfe; 
            background-image: url('./home_page.png'); 
            justify-content: flex-end; /* Horizontal centering is handled by align-items because of flex-direction */
            align-items: center; 
            padding-bottom: 12%; /* Moves it up from the very bottom */
            justify-content: flex-end; 
        }

        #game-screen { 
            background-color: #fab1a0; 
            background-image: url('./game.png'); 
        }

        #result-screen { 
            background-color: #55efc4; 
            background-image: url('./result_page.png'); 
            justify-content: center;
        }

        /* HUD */
        .hud { position: absolute; top: 15px; width: 95%; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .stat-box { background: white; padding: 8px 25px; border-radius: 30px; font-size: 1.5rem; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border:none; }
        #timer-box { background: var(--primary); color: white; font-size: 1.8rem; padding: 10px 30px; border: 4px solid white; border-radius: 50px; }

        /* Button Styling */
        .btn-start {
            padding: 20px 70px; 
            font-size: 2.8rem; 
            background: var(--accent); 
            cursor: pointer; 
            box-shadow: 0 10px 0 #e1c01e;
            border-radius: 60px;
            border: none;
            color: var(--text);
            font-weight: 600;
            transition: transform 0.1s;
        }
        .btn-start:active { transform: translateY(5px); box-shadow: 0 5px 0 #e1c01e; }

        /* Chef & Customer */
        .chef-container { position: absolute; bottom: 0; right: -10px; z-index: 60; pointer-events: none; }
        .chef-img { height: 50vh; max-height: 500px; filter: drop-shadow(-10px 5px 15px rgba(0,0,0,0.2)); }

        .customer-wrapper { position: relative; height: 35vh; width: 100%; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 15px; }
        .customer-img { height: 32vh; max-height: 350px; position: absolute; transition: transform 0.8s ease; transform: translateX(120vw); z-index: 40; }
        .customer-img.at-center { transform: translateX(0); }
        .customer-img.exit-left { transform: translateX(-120vw); }

        .speech-bubble { 
            background: white; padding: 15px 30px; border-radius: 40px; font-size: 1.8rem; font-weight: 600; 
            position: absolute; top: -140px; opacity: 0; transition: opacity 0.3s; z-index: 50; 
            border: 5px solid var(--secondary); min-width: 220px; text-align: center; 
        }
        .speech-bubble.visible { opacity: 1; }

        /* Choice Area (Icons) Responsive */
        .choice-area { 
            display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; 
            align-items: center; gap: 2vw; width: 80%; margin-right: 15%; z-index: 45; 
        }
        .card { 
            background: white; width: 12vw; height: 12vw; min-width: 90px; min-height: 90px; 
            max-width: 140px; max-height: 140px; border-radius: 20%; display: flex; 
            align-items: center; justify-content: center; box-shadow: 0 8px 0 #ddd; 
            cursor: pointer; transition: transform 0.1s; 
        }
        .card img { width: 80%; height: 80%; object-fit: contain; }
        .card.selected { background: var(--secondary); box-shadow: 0 8px 0 #39a69e; }

        .controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .icon-btn { width: 55px; height: 55px; border-radius: 50%; border: none; background: white; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .flash-correct { background-color: #55efc4 !important; }
        .flash-wrong { background-color: #ff7675 !important; }

        @media (max-width: 1024px) {
            .choice-area { width: 75%; margin-right: 18%; }
            .chef-img { height: 45vh; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen">
        <button class="btn-start" onclick="startGame()">START</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="hud">
            <div class="stat-box"><span id="score">0</span></div>
            <div id="timer-box"><span id="timer">3:00</span></div>
        </div>
        <div class="chef-container"><img src="chef.png" class="chef-img" alt="Chef"></div>
        <div class="game-container" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 5vh;">
            <div class="customer-wrapper">
                <div class="speech-bubble" id="speech-bubble">...</div>
                <img src="c1.png" class="customer-img" id="customer-img">
            </div>
            <div class="choice-area" id="choices"></div>
        </div>
        <div class="controls">
            <button class="icon-btn" onclick="toggleAudio()">🔊</button>
            <button class="icon-btn" onclick="goHome()">🏠</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2 style="font-size: 3rem; color: white;">GREAT JOB!</h2>
        <div class="stat-box" style="font-size: 3rem; margin: 20px;"><span id="final-score">0</span></div>
        <button class="btn-start" style="font-size: 2rem;" onclick="goHome()">PLAY AGAIN</button>
    </div>

    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        const MEALS = ['breakfast', 'lunch', 'dinner'];
        const FOODS = ['bread', 'chicken', 'salad', 'soup', 'noodles'];
        const CUSTOMERS = ['c1.png', 'c2.png', 'c3.png', 'c4.png', 'c5.png'];
        
        let score = 0, timeLeft = 180, currentStep = 1, currentTarget = [], playerSelections = [], timerInterval, audioEnabled = true;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id + '-screen').style.display = 'flex';
        }

        function startGame() {
            score = 0; timeLeft = 180; updateHUD();
            showScreen('game'); startTimer(); nextRound();
            if(audioEnabled) document.getElementById('bg-music').play().catch(()=>{});
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; updateHUD();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function updateHUD() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('score').innerText = score;
        }

        async function nextRound() {
            const customer = document.getElementById('customer-img');
            const bubble = document.getElementById('speech-bubble');
            customer.classList.add('exit-left');
            bubble.classList.remove('visible');
            await new Promise(r => setTimeout(r, 850));
            customer.src = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
            customer.className = 'customer-img'; 
            setTimeout(() => {
                customer.classList.add('at-center');
                setupMealStep();
            }, 100);
        }

        function setupMealStep() {
            currentStep = 1;
            const target = MEALS[Math.floor(Math.random() * MEALS.length)];
            currentTarget = [target];
            showBubble(target.charAt(0).toUpperCase() + target.slice(1) + "!");
            renderChoices();
        }

        function setupFoodStep() {
            currentStep = 2;
            playerSelections = [];
            const count = Math.random() > 0.5 ? 2 : 1;
            const shuffledPool = [...FOODS].sort(() => 0.5 - Math.random());
            currentTarget = shuffledPool.slice(0, count);
            let text = "I want " + currentTarget[0];
            if(count === 2) text += " and " + currentTarget[1];
            showBubble(text);
            renderChoices();
        }

        function renderChoices() {
            const container = document.getElementById('choices');
            container.innerHTML = '';
            let finalOptions = [...currentTarget];
            const fullPool = currentStep === 1 ? MEALS : FOODS;
            fullPool.forEach(item => { if (!finalOptions.includes(item)) finalOptions.push(item); });
            finalOptions.sort(() => Math.random() - 0.5);

            finalOptions.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="./${item.toLowerCase()}.png" onerror="this.src='https://via.placeholder.com/100?text=${item}'">`;
                card.onclick = () => handleChoice(item, card);
                container.appendChild(card);
            });
        }

        function handleChoice(item, card) {
            if (currentStep === 1) {
                if (currentTarget.includes(item)) { score += 10; flash('correct'); setupFoodStep(); }
                else { score = Math.max(0, score - 5); flash('wrong'); }
            } else {
                if (currentTarget.includes(item)) {
                    if (!playerSelections.includes(item)) {
                        playerSelections.push(item);
                        card.classList.add('selected');
                    }
                    if (playerSelections.length === currentTarget.length) {
                        score += 10; flash('correct'); showBubble("Yummy!");
                        setTimeout(nextRound, 1500);
                    }
                } else {
                    score = Math.max(0, score - 5); flash('wrong');
                    playerSelections = [];
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                }
            }
            updateHUD();
        }

        function showBubble(text) {
            const b = document.getElementById('speech-bubble');
            b.innerText = text; b.classList.add('visible');
            if (audioEnabled) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            }
        }

        function flash(type) {
            document.body.classList.add(type === 'correct' ? 'flash-correct' : 'flash-wrong');
            setTimeout(() => document.body.classList.remove('flash-correct', 'flash-wrong'), 300);
        }

        function toggleAudio() { audioEnabled = !audioEnabled; }
        function goHome() { clearInterval(timerInterval); showScreen('home'); }
        function endGame() { document.getElementById('final-score').innerText = score; showScreen('result'); }
    </script>
</body>
</html>
